<header class="episode-header">
  <div class="ep-badge">EP{{ printf "%02d" .Params.episode }}</div>
  <h1 class="ep-main-title">{{ .Title }}</h1>
  {{ with .Params.subtitle }}<div class="ep-subtitle">{{ . }}</div>{{ end }}

  <div class="ep-meta">
    {{ with .Params.duration }}
    <span class="meta-item">
      <span class="meta-icon">▶</span> {{ . }}
    </span>
    {{ end }}
    {{ with .Params.domains }}
    <span class="meta-item domains">
      {{ range . }}<span class="domain-chip">{{ . }}</span>{{ end }}
    </span>
    {{ end }}
  </div>
</header>
