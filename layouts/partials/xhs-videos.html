{{ if .Params.xhs_notes }}
<div class="xhs-section">
  <div class="xhs-section-header">
    <span class="xhs-logo-badge">小红书</span>
    <span class="xhs-section-title">Watch on 小红书</span>
  </div>
  <div class="xhs-cards">
    {{ range .Params.xhs_notes }}
    <a href="{{ .url }}" target="_blank" rel="noopener" class="xhs-card">
      <div class="xhs-card-inner">
        <div class="xhs-card-icon">▶</div>
        <div class="xhs-card-text">
          <div class="xhs-card-title">{{ .title }}</div>
          <div class="xhs-card-sub">xiaohongshu.com</div>
        </div>
        <div class="xhs-card-arrow">→</div>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
